name: Build APK and AAB

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      source_url:
        required: true
      build_type:
        required: false
        default: both
      screen_explore:
        required: false
        default: 'false'
      apk_upload_url:
        required: false
      aab_upload_url:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download & extract source
        run: |
          curl -L "${{ github.event.inputs.source_url }}" -o source.zip
          mkdir -p project
          unzip -q source.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold Android platform folder
        working-directory: project
        run: flutter create --platforms=android .

      - name: Bump Gradle wrapper version
        working-directory: project
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Build AAB
        working-directory: project
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: project/build/app/outputs/bundle/release/app-release.aab
          retention-days: 1
