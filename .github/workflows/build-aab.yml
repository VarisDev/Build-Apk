name: Build AAB

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      source_url:
        required: true
      build_type:
        required: false
        default: aab
      screen_explore:
        required: false
        default: 'false'
      aab_upload_url:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download & extract source
        run: |
          curl -L "${{ github.event.inputs.source_url }}" -o source.zip
          mkdir -p project
          unzip -q source.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Scaffold Android platform folder
        working-directory: project
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build AAB
        working-directory: project
        run: flutter build appbundle --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: project/build/app/outputs/bundle/release/app-release.aab
          retention-days: 1
